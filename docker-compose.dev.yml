# Development build, from source. For running AutoThrottle, use
# docker-compose.yml instead — it pulls the published image.
#
# Deliberately the same shape as the public file — bind mount, PUID/PGID,
# no credentials — so the dev instance exercises what a new user gets.
# scripts/dev-build.sh drives it.
services:
  autothrottle:
    build:
      context: .
      args:
        # A release stamps this from the git tag; this is the local default.
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: autothrottle-local:latest
    pull_policy: never
    container_name: autothrottle
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./data:/data
    ports:
      - "7676:7676"
    restart: unless-stopped
    # The app sits around 10–25 MiB. The cap is about this container
    # never being the reason something else on the host dies: Docker
    # advertises the host's full RAM to every container by default.
    mem_limit: 256m
    memswap_limit: 256m
