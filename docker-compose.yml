---
services:
  autothrottle:
    build:
      context: .
      args:
        # A release stamps this from the git tag; this is the local default.
        VERSION: ${VERSION:-dev}
        # Populate these for a local build that should identify itself:
        #   COMMIT=$(git rev-parse --short HEAD) \
        #   BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) docker compose build
        COMMIT: ${COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: autothrottle-local:latest
    pull_policy: never
    container_name: autothrottle
    environment:
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=devpassword
      - TZ=America/Los_Angeles
    volumes:
      - autothrottle_data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    # The app is a static Go binary over an embedded SQLite file and
    # sits at ~22 MiB in practice. The cap is not about this container
    # being greedy — it is about it being unable to become the reason
    # something else on the host dies. Docker advertises the host's
    # full RAM to every container, so nothing self-limits by default.
    mem_limit: 256m
    memswap_limit: 256m

volumes:
  autothrottle_data:
