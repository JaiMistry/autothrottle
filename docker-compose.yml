services:
  autothrottle:
    image: jaimistry/autothrottle:latest
    container_name: autothrottle
    # Runs as this user so it can write to ./data. Set them to the owner
    # of that directory — `id -u` and `id -g` on the host.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=America/Los_Angeles
      # Optional. Leave unset to create an account in the browser on
      # first run, using the setup code printed in the container log.
      # - AUTH_USERNAME=admin
      # - AUTH_PASSWORD=change-me
    volumes:
      - ./data:/data
    ports:
      - "7676:7676"
    restart: unless-stopped
