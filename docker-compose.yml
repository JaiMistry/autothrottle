services:
  autothrottle:
    image: jaimistry/autothrottle:latest
    container_name: autothrottle
    environment:
      # The user and group that own ./data on the host — `id -u` and
      # `id -g`. AutoThrottle runs as them and fixes ownership itself.
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      # Optional. Leave unset to create an account in the browser on
      # first run, using the setup code printed in the container log.
      # - AUTH_USERNAME=admin
      # - AUTH_PASSWORD=change-me
    volumes:
      - ./data:/data
    ports:
      - "7676:7676"
    restart: unless-stopped
