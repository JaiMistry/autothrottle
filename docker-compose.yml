services:
  autothrottle:
    image: jaimistry/autothrottle:latest
    container_name: autothrottle
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles # Reference: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      # Optional. Env username and password take precedence over the web UI
      # - AUTH_USERNAME=
      # - AUTH_PASSWORD=
      - AUTH_DISABLED=false # Optional. Set to true to turn sign-in off
    volumes:
      - /data:/data
    ports:
      - "7676:7676"
    restart: unless-stopped
