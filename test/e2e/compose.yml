# End-to-end test stack: AutoThrottle against a real Jellyfin, Emby or
# Plex (one per run, chosen by profile), qBittorrent and Transmission.
# Driven by test/e2e/run.sh — see the README there.
#
# Everything is published on 1xxxx ports so the stack can run beside a
# normal install without a clash. The linuxserver images come straight
# from ghcr.io: lscr.io is only a redirector in front of it, and the
# one that rate-limits.
name: autothrottle-e2e

services:
  autothrottle:
    image: ${AT_IMAGE:-autothrottle-e2e}
    build:
      context: ../..
    container_name: e2e-autothrottle
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./.state/autothrottle:/data
    ports:
      - "17676:7676"
    mem_limit: 256m

  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    profiles: [jellyfin]
    container_name: e2e-jellyfin
    volumes:
      - ./.state/jellyfin:/config
      - ./fixtures:/media/movies:ro
    ports:
      - "18196:8096"
    mem_limit: 1g

  emby:
    image: emby/embyserver:4.9.5.0
    profiles: [emby]
    container_name: e2e-emby
    environment:
      - UID=1000
      - GID=1000
    volumes:
      - ./.state/emby:/config
      - ./fixtures:/media/movies:ro
    ports:
      - "18096:8096"
    mem_limit: 1g

  plex:
    image: plexinc/pms-docker:1.43.4.10903-e5521bd8c
    profiles: [plex]
    container_name: e2e-plex
    # Plex names the server after its host, and the run's cleanup finds
    # it on the account by this name.
    hostname: e2e-plex
    environment:
      # A one-time code from plex.tv, fetched just before start, that
      # claims this server for the test account.
      - PLEX_CLAIM=${PLEX_CLAIM:-}
      - TZ=America/Los_Angeles
    volumes:
      - ./.state/plex:/config
      - ./fixtures:/media/movies:ro
    ports:
      - "18324:32400"
    mem_limit: 1g

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:5.2.3
    container_name: e2e-qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
    volumes:
      - ./.state/qbittorrent:/config
    ports:
      - "18180:8080"
    mem_limit: 512m

  transmission:
    image: ghcr.io/linuxserver/transmission:4.1.3
    container_name: e2e-transmission
    environment:
      - PUID=1000
      - PGID=1000
      - USER=e2e
      - PASS=e2e-transmission
    volumes:
      - ./.state/transmission:/config
    ports:
      - "18191:9091"
    mem_limit: 256m
