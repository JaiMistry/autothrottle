# End-to-end test stack: AutoThrottle against a real Jellyfin, Emby or
# Plex (one per run, chosen by profile), qBittorrent, Transmission and
# Deluge. Driven by test/e2e/run.sh — see the README there.
#
# Each server is pinned to the oldest version the README promises (its
# "1.43+"), on purpose and frozen: with compose.newest.yml's latest
# releases, every night tests both ends of what's supported. Renovate
# leaves them alone (it skips test folders). A pin moves only when the
# README's minimum does; bumping one to make a failure go
# away would stop testing what the README claims. Where the minimum has
# no image, or its first builds are betas, it's the oldest stable build:
# Emby 4.9.1.80 (its 4.9.0.x are betas), Deluge 2.1.1 (2.1.0 has none).
#
# Ports are 1xxxx so the stack runs beside a normal install. The
# linuxserver images come from ghcr.io directly: lscr.io, a redirector in
# front of it, rate-limits.
name: autothrottle-e2e

services:
  autothrottle:
    image: ${AT_IMAGE:-autothrottle-e2e}
    build:
      context: ../..
    container_name: e2e-autothrottle
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./.state/autothrottle:/data
    ports:
      - "17676:7676"
    mem_limit: 256m

  jellyfin:
    image: jellyfin/jellyfin:10.11.0
    profiles: [jellyfin]
    container_name: e2e-jellyfin
    volumes:
      - ./.state/jellyfin:/config
      - ./fixtures:/media:ro
    ports:
      - "18196:8096"
    mem_limit: 1g

  emby:
    image: emby/embyserver:4.9.1.80
    profiles: [emby]
    container_name: e2e-emby
    environment:
      - UID=1000
      - GID=1000
    volumes:
      - ./.state/emby:/config
      - ./fixtures:/media:ro
    ports:
      - "18096:8096"
    mem_limit: 1g

  plex:
    image: plexinc/pms-docker:1.43.0.10467-2b1ba6e69
    profiles: [plex]
    container_name: e2e-plex
    # The server's name on the account. run.sh gives each run its own, so
    # two runs sharing the account can tell their servers apart.
    hostname: ${PLEX_SERVER_NAME:-e2e-plex}
    environment:
      # One-time code from plex.tv that claims the server for the test account.
      - PLEX_CLAIM=${PLEX_CLAIM:-}
      - TZ=America/Los_Angeles
    volumes:
      - ./.state/plex:/config
      - ./fixtures:/media:ro
    ports:
      - "18324:32400"
    mem_limit: 1g

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:5.2.0
    container_name: e2e-qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
    volumes:
      - ./.state/qbittorrent:/config
    ports:
      - "18180:8080"
    mem_limit: 512m

  transmission:
    image: ghcr.io/linuxserver/transmission:4.1.0
    container_name: e2e-transmission
    environment:
      - PUID=1000
      - PGID=1000
      - USER=e2e
      - PASS=e2e-transmission
    volumes:
      - ./.state/transmission:/config
    ports:
      - "18191:9091"
    mem_limit: 256m

  deluge:
    image: ghcr.io/linuxserver/deluge:2.1.1
    container_name: e2e-deluge
    # Its Web UI's password stays the image's default, deluge, and the Web
    # UI starts disconnected from its daemon: AutoThrottle connects it.
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./.state/deluge:/config
    ports:
      - "18112:8112"
    mem_limit: 512m
