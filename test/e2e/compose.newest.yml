# Every server at its newest release, over the pinned versions in
# compose.yml: E2E_NEWEST=1 test/e2e/run.sh. The nightly runs this too, to
# find out when an upstream release breaks something before users do.
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
  emby:
    image: emby/embyserver:latest
  plex:
    image: plexinc/pms-docker:latest
  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:latest
  transmission:
    image: ghcr.io/linuxserver/transmission:latest
