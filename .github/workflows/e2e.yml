name: E2E

# The full suite against real Jellyfin, Emby and Plex (one job each),
# qBittorrent and Transmission. Too heavy for every push, so it runs
# nightly, on demand from the Actions tab, and on pull requests that
# change what it tests: dependency updates, chiefly, where it proves the
# new versions work before they merge.
#
# Nightly it also runs against each server's newest release, at the same
# time, and keeps one issue open while that fails: an upstream release
# that breaks AutoThrottle is found before users find it. On demand that
# round is optional, since checking a change only needs the pinned ones.
on:
  workflow_dispatch:
    inputs:
      newest:
        description: Also run against each server's newest release
        type: boolean
        default: false
  schedule:
    - cron: "17 9 * * *"
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "test/e2e/**"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/e2e-suite.yml"

permissions:
  contents: read

# Plex runs against one real plex.tv account. Each job removes only its
# own server and sign-ins from it, so the two rounds can share it, but one
# workflow run at a time keeps it to two test servers.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  pinned:
    strategy:
      fail-fast: false
      matrix:
        media: [jellyfin, emby, plex]
    name: e2e (${{ matrix.media }})
    uses: ./.github/workflows/e2e-suite.yml
    with:
      media: ${{ matrix.media }}
    secrets: inherit

  newest:
    if: github.event_name == 'schedule' || inputs.newest
    strategy:
      fail-fast: false
      matrix:
        media: [jellyfin, emby, plex]
    name: newest (${{ matrix.media }})
    uses: ./.github/workflows/e2e-suite.yml
    with:
      media: ${{ matrix.media }}
      newest: true
    secrets: inherit

  # One issue while the newest releases fail, kept current each night and
  # closed by the first run that passes.
  report:
    needs: newest
    if: always() && (needs.newest.result == 'success' || needs.newest.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: versions-*
          merge-multiple: true

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.newest.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="E2E fails against the newest upstream releases"
          open=$(gh issue list --state open --label upstream --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)

          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Passing again against the newest releases: $RUN_URL"
            fi
            exit 0
          fi

          failed=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" and (.name | startswith("newest"))) | "- " + .name')
          {
            echo "The end-to-end run against each server's newest release failed. An upstream release may have changed something AutoThrottle relies on."
            echo
            echo "**Run:** $RUN_URL"
            echo
            echo "**Failed:**"
            echo "$failed"
            echo
            echo "**Versions tested:**"
            sort -u versions-*.md 2>/dev/null || echo "- not recorded"
            echo
            echo "This issue is updated each night while the run fails, and closes itself when it passes."
          } > body.md

          if [ -n "$open" ]; then
            gh issue edit "$open" --body-file body.md
          else
            gh issue create --title "$title" --label upstream --body-file body.md
          fi
