name: E2E

# The full suite against real Jellyfin, qBittorrent and Transmission.
# Too heavy for every push — about 2 GB of images — so it runs nightly,
# and on demand from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run the end-to-end suite
        run: test/e2e/run.sh

      - name: Keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: test/e2e/.state/failure.png
          if-no-files-found: ignore
