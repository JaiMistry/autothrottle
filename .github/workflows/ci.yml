name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true

      - name: gofmt check
        run: |
          diff -u <(echo -n) <(gofmt -l .)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Counted across packages, so code a package's tests reach through
      # another counts. Each package's profile repeats every block; keep
      # the highest count per block.
      - name: Test with coverage
        run: |
          go test -coverpkg=./... -coverprofile=coverage.all.out ./...
          awk 'NR==1{print;next} {k=$1; if(!(k in c) || $3>c[k]) {c[k]=$3; n[k]=$2}} END{for(k in c) print k, n[k], c[k]}' coverage.all.out > coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t autothrottle:scan .
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: autothrottle:scan
          severity: CRITICAL,HIGH
