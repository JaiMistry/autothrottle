name: Scan

# The latest release, as published, checked weekly for vulnerabilities
# disclosed since it shipped, and again straight after each release. One
# issue stays open while any are found, and closes itself when a scan
# comes back clean.
#
# A finding is the cue for a patch release, started at once instead of
# waiting for the monthly one, but only when main fixes it: main is built
# and scanned the same way, and released if it clears at least one of the
# release's findings and its CI passes. Otherwise the issue waits for a
# fix.
on:
  schedule:
    - cron: "23 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write # to start a patch release

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the history, to see what main has since the release

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Pull the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          image="jaimistry/autothrottle:${tag#v}"
          docker pull -q "$image"
          # The binary on its own, for govulncheck.
          id=$(docker create "$image")
          docker cp "$id:/autothrottle" ./autothrottle
          docker rm "$id" >/dev/null
          { echo "tag=$tag"; echo "image=$image"; } >> "$GITHUB_OUTPUT"

      # Go's own scanner reads the module and standard library versions
      # built into the binary, and reports only vulnerable code it contains.
      # Exit status 3 means it found something; any other failure is the
      # scan itself breaking, which fails the run rather than reporting.
      - name: govulncheck
        id: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          status=0
          govulncheck -mode=binary ./autothrottle > govulncheck.txt || status=$?
          cat govulncheck.txt
          case "$status" in
            0) echo "found=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "found=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.release.outputs.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          output: trivy.txt

      # Only when the release has findings: is there a fix on main to
      # release? "unchanged" if nothing that ships has changed since the
      # release, "untested" if main's CI hasn't passed, otherwise main is
      # built and scanned below.
      - name: Look at main
        id: main
        if: steps.govulncheck.outputs.found == 'true' || steps.trivy.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          state=unchanged
          if python3 .github/scripts/release_notes.py shipped "$TAG"; then
            ci=$(gh run list --workflow ci.yml --branch main --event push --commit "$(git rev-parse HEAD)" \
              --limit 1 --json conclusion --jq '.[0].conclusion // ""')
            if [ "$ci" = success ]; then
              state=changed
            else
              echo "Main has changed since $TAG, but its CI hasn't passed (${ci:-not run})."
              state=untested
            fi
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.main.outputs.state == 'changed'

      - name: Build main
        if: steps.main.outputs.state == 'changed'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: autothrottle:main
          cache-from: type=gha,scope=release

      - name: govulncheck main
        id: govulncheck-main
        if: steps.main.outputs.state == 'changed'
        run: |
          id=$(docker create autothrottle:main)
          docker cp "$id:/autothrottle" ./autothrottle-main
          docker rm "$id" >/dev/null
          status=0
          govulncheck -mode=binary ./autothrottle-main > govulncheck-main.txt || status=$?
          cat govulncheck-main.txt
          case "$status" in 0|3) ;; *) exit "$status" ;; esac

      - name: Trivy main
        id: trivy-main
        if: steps.main.outputs.state == 'changed'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autothrottle:main
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          output: trivy-main.txt

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          GOVULNCHECK: ${{ steps.govulncheck.outputs.found }}
          TRIVY: ${{ steps.trivy.outcome }}
          TRIVY_MAIN: ${{ steps.trivy-main.outcome }}
          MAIN: ${{ steps.main.outputs.state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Vulnerabilities in the released image"
          open=$(gh issue list --state open --label security --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)

          for report in trivy.txt:"$TRIVY" trivy-main.txt:"$TRIVY_MAIN"; do
            if [ "${report#*:}" = failure ] && [ ! -s "${report%%:*}" ]; then
              echo "::error::Trivy failed without a report (${report%%:*}); see its step."
              exit 1
            fi
          done
          if [ "$GOVULNCHECK" = false ] && [ "$TRIVY" = success ]; then
            echo "$TAG is clean."
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "The scan of $TAG is clean: $RUN_URL"
            fi
            exit 0
          fi

          # The IDs each scan found: govulncheck's GO-… and the Vulnerability
          # column of Trivy's table.
          ids() {
            {
              grep -oE '^Vulnerability #[0-9]+: GO-[0-9]+-[0-9]+' "$1" 2>/dev/null | awk '{print $3}'
              awk -F'│' '{gsub(/ /, "", $3); if ($3 ~ /^(CVE|GHSA|GO)-/) print $3}' "$2" 2>/dev/null
            } | sort -u
          }

          case "$MAIN" in
            unchanged)
              next="Main has nothing new since $TAG to release. Once a fix is in (Renovate's, or one made by hand), the next scan releases it."
              ;;
            untested)
              next="Main has changed since $TAG, but its CI hasn't passed, so nothing is released from it. Once it passes, the next scan checks it again."
              ;;
            changed)
              fixed=$(comm -23 <(ids govulncheck.txt trivy.txt) <(ids govulncheck-main.txt trivy-main.txt))
              if [ -n "$fixed" ]; then
                count=$(wc -l <<< "$fixed")
                [ "$count" = 1 ] && what="a known vulnerability" || what="$count known vulnerabilities"
                gh workflow run release.yml --ref main -f bump=patch \
                  -f notes="Released early: fixes $what found in $TAG by the weekly scan." \
                  -f security="$(paste -sd' ' - <<< "$fixed")"
                next="Main fixes $(paste -sd, - <<< "$fixed" | sed 's/,/, /g'), so a patch release has been started: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml. The new release is scanned as soon as it is out, and this issue closes itself if that scan is clean."
              else
                next="Main has changed since $TAG, but a scan of it finds the same vulnerabilities, so there is no fix to release yet. Once one is in (Renovate's, or one made by hand), the next scan releases it."
              fi
              ;;
          esac
          echo "$next"

          {
            echo "The scan of **$TAG** found known vulnerabilities."
            echo
            echo "$next"
            echo
            echo "**Run:** $RUN_URL"
            if [ "$GOVULNCHECK" = true ]; then
              echo
              echo "### govulncheck"
              echo '```'
              cat govulncheck.txt 2>/dev/null || echo "No output; see the run."
              echo '```'
            fi
            if [ "$TRIVY" != success ]; then
              echo
              echo "### Trivy (high and critical)"
              echo '```'
              cat trivy.txt 2>/dev/null || echo "No output; see the run."
              echo '```'
            fi
            echo
            echo "This issue is updated by each scan, and closes itself when one is clean."
          } > body.md

          if [ -n "$open" ]; then
            gh issue edit "$open" --body-file body.md
          else
            gh issue create --title "$title" --label security --body-file body.md
          fi
