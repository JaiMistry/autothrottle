name: Release

# Run from the Actions tab: choose which part of the version to raise and
# write the notes. A version tag pushed by hand (v1.2.0-rc.1, say) also
# releases, with notes generated from the commits since the last.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: Release notes
        type: string
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the GitHub release and its tag
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to find the last release

      # A pushed tag names itself. Otherwise the next version follows the
      # newest stable tag, and the tag itself is only created with the
      # release at the end: a run that fails leaves nothing behind, and
      # running it again picks the same version.
      - name: Version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases are made from main."
              exit 1
            fi
            last=$(git tag -l 'v*' --sort=-v:refname | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | head -n1)
            if [ -n "$last" ] && [ "$(git rev-list -n1 "$last")" = "$GITHUB_SHA" ]; then
              echo "::error::Nothing new since $last."
              exit 1
            fi
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) tag="v$((major + 1)).0.0" ;;
              minor) tag="v${major:-0}.$((minor + 1)).0" ;;
              *) tag="v${major:-0}.${minor:-0}.$((patch + 1))" ;;
            esac
          fi
          stable=true
          case "$tag" in *-*) stable=false ;; esac
          echo "Releasing $tag"
          # The date is the released commit's own, so rebuilding a release
          # stamps it the same.
          {
            echo "tag=$tag"
            echo "stable=$stable"
            echo "date=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # About reads these back out of the binary. Without them a released
      # image cannot say which commit it came from.
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: autothrottle:smoke
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}

      # Started once before anything is published: it must come up, as a
      # fresh install, and serve the create-account screen.
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 7676:7676 autothrottle:smoke
          for _ in $(seq 30); do
            if curl -fs -o /dev/null http://localhost:7676/setup; then
              echo "The image starts and serves the setup screen."
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/jaimistry/autothrottle
            jaimistry/autothrottle
          # 1.4.2, 1.4 and 1, so users choose how far they follow. A
          # pre-release gets only its own version: "latest" must only ever
          # mean the newest stable release, or every plain pull would get a
          # release candidate.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}

      # The image as files on the release page too, one per architecture,
      # for anyone loading it without a registry. Pulled back from the
      # registry so they are exactly what was published. GitHub records
      # each file's SHA-256 on the release page.
      - name: Save the images
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          for arch in amd64 arm64; do
            docker pull -q --platform "linux/$arch" "ghcr.io/jaimistry/autothrottle:$version"
            docker tag "ghcr.io/jaimistry/autothrottle:$version" "jaimistry/autothrottle:$version"
            docker save "jaimistry/autothrottle:$version" | gzip -9 > "autothrottle-$TAG-linux-$arch.tar.gz"
          done

      # The release page the version badge and update check read from.
      # Creating it creates the tag, on the commit just built.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
          STABLE: ${{ steps.version.outputs.stable }}
        run: |
          flags=""
          [ "$STABLE" = true ] || flags="--prerelease"
          if [ -n "$NOTES" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES" $flags \
              autothrottle-*.tar.gz
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes $flags \
              autothrottle-*.tar.gz
          fi

  # Separate, so a problem there never holds a release back.
  docker-hub-description:
    needs: publish
    if: needs.publish.outputs.stable == 'true'
    uses: ./.github/workflows/docker-hub-description.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit
