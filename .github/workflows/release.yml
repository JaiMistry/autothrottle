name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the GitHub release
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/jaimistry/autothrottle
            jaimistry/autothrottle
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # "latest" must only ever mean the newest stable release. A
            # pre-release tag (v1.0.0-rc.1) would otherwise claim it and
            # hand every `docker pull autothrottle` a release candidate.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/setup-buildx-action@v3

      # The released commit's own date, so rebuilding a release stamps it
      # the same.
      - name: Commit date
        id: stamp
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # About reads these back out of the binary. Without them a
          # released image cannot say which commit it came from.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.date }}

      # The image as files on the release page too, one per architecture,
      # for anyone loading it without a registry. Pulled back from the
      # registry so they are exactly what was published.
      - name: Save the images
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            docker pull -q --platform "linux/$arch" "ghcr.io/jaimistry/autothrottle:$version"
            docker tag "ghcr.io/jaimistry/autothrottle:$version" "jaimistry/autothrottle:$version"
            docker save "jaimistry/autothrottle:$version" | gzip -9 > "autothrottle-$GITHUB_REF_NAME-linux-$arch.tar.gz"
          done
          sha256sum autothrottle-*.tar.gz > SHA256SUMS

      # The release page the version badge and update check read from,
      # with notes generated from the commits since the last one.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags="--generate-notes --verify-tag"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          notes=$(printf '%s\n\n%s\n%s\n' \
            "Pull \`jaimistry/autothrottle:$version\` or \`ghcr.io/jaimistry/autothrottle:$version\`." \
            "Without a registry, download the file for your architecture below and run" \
            "\`docker load -i autothrottle-$GITHUB_REF_NAME-linux-<arch>.tar.gz\`.")
          gh release create "$GITHUB_REF_NAME" $flags --notes "$notes" \
            autothrottle-*.tar.gz SHA256SUMS
