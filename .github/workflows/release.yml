name: Release

# Releases happen three ways:
#   - from the Actions tab, raising whichever part of the version you choose;
#   - on the first Tuesday of each month, as a patch release, if anything
#     that ships has changed since the last release (tests, CI and docs on
#     their own never make one). Tuesday follows Renovate's Monday, so a
#     month of dependency updates goes out together;
#   - by pushing a version tag by hand (v1.2.0-rc.1, say).
# The notes are generated from the commits since the last release
# (.github/scripts/release_notes.py), under a summary if one is given.
#
# Every release also carries the Windows installer (windows.yml).
#
# A release started from the Actions tab by the repository's owner is
# created with their RELEASE_TOKEN, so it shows as theirs rather than the
# bot's; automatic ones stay the bot's. Without the secret, the bot's
# token is used.
#
# A pull request that changes how releases are built gets a dry run:
# everything up to publishing, so a broken release is caught before it
# merges rather than on release day.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: Summary to put above the generated notes (optional)
        type: string
        required: false
  schedule:
    - cron: "0 17 * * 2"
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/release.yml"
      - ".github/scripts/release_notes.py"
      - ".github/workflows/windows.yml"
      - "packaging/windows/**"

permissions:
  contents: write # to create the GitHub release and its tag
  packages: write
  actions: write # to start the scan of what was released

# Releases queue behind each other; a dry run only replaces an older one
# for the same pull request.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      prev: ${{ steps.version.outputs.prev }}
      stable: ${{ steps.version.outputs.stable }}
      date: ${{ steps.version.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to find the last release

      # A pushed tag names itself. Otherwise the next version follows the
      # newest stable tag, and the tag itself is only created with the
      # release at the end: a run that fails leaves nothing behind, and
      # running it again picks the same version.
      - name: Version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          stable_tags() { git tag -l 'v*' --sort=-v:refname | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; }; }
          last=$(stable_tags | head -n1)
          release=true
          case "$GITHUB_EVENT_NAME" in
            push)
              last=$(stable_tags | { grep -vx "$GITHUB_REF_NAME" || true; } | head -n1)
              # A release made with RELEASE_TOKEN creates its tag as a
              # push, which starts this again: that release is done.
              if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                echo "$GITHUB_REF_NAME is already released."
                release=false
              fi
              ;;
            schedule)
              if [ "$(date -u +%-d)" -gt 7 ]; then
                echo "Scheduled releases are made in the first week of the month."
                release=false
              elif [ -z "$last" ] || ! python3 .github/scripts/release_notes.py shipped "$last"; then
                echo "Nothing that ships has changed since ${last:-the start}; no release this month."
                release=false
              fi
              ;;
            workflow_dispatch)
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "::error::Releases are made from main."
                exit 1
              fi
              if [ -n "$last" ] && [ "$(git rev-list -n1 "$last")" = "$GITHUB_SHA" ]; then
                echo "::error::Nothing new since $last."
                exit 1
              fi
              ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) tag="v$((major + 1)).0.0" ;;
              minor) tag="v${major:-0}.$((minor + 1)).0" ;;
              *) tag="v${major:-0}.${minor:-0}.$((patch + 1))" ;;
            esac
          fi
          stable=true
          case "$tag" in *-*) stable=false ;; esac
          [ "$release" = true ] && echo "Releasing $tag"
          [ "$GITHUB_EVENT_NAME" = pull_request ] && echo "(a dry run: nothing is published)"
          # The date is the released commit's own, so rebuilding a release
          # stamps it the same.
          {
            echo "release=$release"
            echo "tag=$tag"
            echo "prev=$last"
            echo "stable=$stable"
            echo "date=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"

  # The Windows installer, built and tested on real Windows before the
  # release that carries it is published.
  windows:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.plan.outputs.tag }}
      commit: ${{ github.sha }}
      date: ${{ needs.plan.outputs.date }}

  publish:
    needs: [plan, windows]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
      # Pull requests from forks get no secrets, so their dry run skips
      # signing in to the registries.
      SIGN_IN: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the history, for the notes

      - uses: docker/setup-buildx-action@v3

      # About reads these back out of the binary. Without them a released
      # image cannot say which commit it came from.
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: autothrottle:smoke
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          build-args: |
            VERSION=${{ needs.plan.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.plan.outputs.date }}

      # Started once before anything is published: it must come up, as a
      # fresh install, and serve the create-account screen.
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 7676:7676 autothrottle:smoke
          for _ in $(seq 30); do
            if curl -fs -o /dev/null http://localhost:7676/setup; then
              echo "The image starts and serves the setup screen."
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Log in to GHCR
        if: env.SIGN_IN == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.SIGN_IN == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/jaimistry/autothrottle
            jaimistry/autothrottle
          # 1.4.2, 1.4 and 1, so users choose how far they follow. A
          # pre-release gets only its own version: "latest" must only ever
          # mean the newest stable release, or every plain pull would get a
          # release candidate.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.plan.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.plan.outputs.stable }}

      # A dry run builds both architectures and stops short of pushing.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.DRY_RUN != 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          build-args: |
            VERSION=${{ needs.plan.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.plan.outputs.date }}

      # Shown on the run's summary page too, which is where a dry run's
      # notes can be read.
      - name: Release notes
        env:
          PREV: ${{ needs.plan.outputs.prev }}
          TAG: ${{ needs.plan.outputs.tag }}
          SUMMARY: ${{ inputs.notes }}
        run: |
          python3 .github/scripts/release_notes.py notes "$PREV" "$TAG" "$SUMMARY" > notes.md
          cat notes.md
          { echo "## $TAG"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"

      # The image as files on the release page too, one per architecture,
      # for anyone loading it without a registry. Pulled back from the
      # registry so they are exactly what was published. GitHub records
      # each file's SHA-256 on the release page.
      - name: Save the images
        if: env.DRY_RUN != 'true'
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version="${TAG#v}"
          for arch in amd64 arm64; do
            docker pull -q --platform "linux/$arch" "ghcr.io/jaimistry/autothrottle:$version"
            docker tag "ghcr.io/jaimistry/autothrottle:$version" "jaimistry/autothrottle:$version"
            docker save "jaimistry/autothrottle:$version" | gzip -9 > "autothrottle-$TAG-linux-$arch.tar.gz"
          done

      - name: Fetch the Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      # The release page the version badge and update check read from.
      # Creating it creates the tag, on the commit just built. About's
      # update check on Windows links to the installer by this name.
      - name: Create the GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.triggering_actor == github.repository_owner && secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          STABLE: ${{ needs.plan.outputs.stable }}
        run: |
          flags=()
          [ "$STABLE" = true ] || flags+=(--prerelease)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            flags+=(--verify-tag)
          else
            flags+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "${flags[@]}" --title "$TAG" --notes-file notes.md autothrottle-*.tar.gz AutoThrottle-Setup-*.exe

  # Separate, so a problem there never holds a release back.
  docker-hub-description:
    needs: [plan, publish]
    if: needs.plan.outputs.stable == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/docker-hub-description.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit

  # The new release scanned straight away, rather than next Monday: it
  # closes the vulnerabilities issue if this release was the fix.
  scan:
    needs: [plan, publish]
    if: needs.plan.outputs.stable == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Start the scan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run scan.yml --ref main
