name: Bug report
description: Something isn't throttling, restoring or showing as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Describe your issue
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The steps that lead to it, if you know them.
