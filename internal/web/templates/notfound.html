{{define "content"}}
<div class="at-nf">
  <div class="at-nf-head">
    <span class="at-nf-code">404</span>
    <h1 class="at-nf-title">Nothing here to throttle</h1>
  </div>
  <div class="at-nf-rate" aria-label="Upload 0 KB/s, download 0 KB/s">
    <span class="at-nf-up">↑ 0 KB/s</span><span class="at-nf-sep" aria-hidden="true">/</span><span class="at-nf-down">↓ 0 KB/s</span>
  </div>
  <div class="at-card at-nf-log">
    <span class="at-nf-time">{{.Time}}</span>
    <span class="at-nf-lvl">WARN</span>
    <span class="at-nf-msg">{{.Message}}</span>
  </div>
  <div class="at-nf-actions">
    <a class="at-btn at-btn--primary" href="/">Go to Dashboard</a>
    <a class="at-btn" href="/logs">Open Logs</a>
  </div>
</div>
{{end}}
