{{define "content"}}
<div style="width:100%;max-width:360px">
  <div style="display:grid;justify-items:center;margin-bottom:var(--space-12)">
    <img src="/static/img/logo-lockup.svg" alt="AutoThrottle" style="height:34px">
  </div>
  <section class="at-card">
    {{if .Error}}
      <div style="margin-bottom:var(--space-6)">
        {{template "alert" dict "Tone" "error" "Title" "Could not sign in" "Body" .Error}}
      </div>
    {{end}}
    <form method="post" action="/login" class="at-stack">
      <label class="at-field">
        <span class="at-field-label">Username</span>
        <input class="at-input" type="text" name="username" autocomplete="username" autofocus required>
      </label>
      <label class="at-field">
        <span class="at-field-label">Password</span>
        <input class="at-input" type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="at-btn at-btn--primary at-btn--md at-btn--block">Log in</button>
    </form>
  </section>
  <p style="text-align:center;margin:var(--space-8) 0 0;font-size:var(--text-label);color:var(--text-faint)">
    Credentials come from the environment this app was deployed with.
  </p>
</div>
{{end}}
