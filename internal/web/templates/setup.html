{{define "content"}}
{{/* Only while no account exists; then this page and its address are gone. */}}
<div class="at-login-inner">
  <div class="at-login-brand">
    <img src="/static/img/logo-mark.svg" width="72" height="72" alt="">
    <span class="at-login-name">AutoThrottle</span>
  </div>
  <section class="at-card" style="padding:20px 22px;width:100%">
    <div>
    <form method="post" action="/setup" class="at-stack" data-fill-required="username,password">
      <input type="hidden" name="csrf_token" value="{{.Token}}">
      <div class="at-setup-head">
        <h1 class="at-setup-title">Set up your login</h1>
        <p class="at-setup-sub">Create your login credentials for access.</p>
      </div>
      {{if .Error}}{{template "alert" dict "Tone" "error" "Title" .Error}}{{end}}
      <label class="at-field">
        <span class="at-field-label">Username</span>
        <input class="at-input" type="text" name="username" value="{{.Username}}" autocomplete="username" autofocus>
      </label>
      <label class="at-field">
        <span class="at-field-label">Password</span>
        <span class="at-reveal">
          <input class="at-input" type="password" name="password" autocomplete="new-password">
          <button type="button" class="at-reveal-btn" data-reveal aria-pressed="false" aria-label="Show password">Show</button>
        </span>
      </label>
      <button type="submit" class="at-btn at-btn--primary at-btn--md at-btn--block" style="margin-top:var(--space-2)" data-submit disabled>Create account</button>
    </form>
    </div>
  </section>
</div>
{{end}}
